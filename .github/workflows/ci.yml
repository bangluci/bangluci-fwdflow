name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: fwdflow
          POSTGRES_PASSWORD: fwdflow_ci
          POSTGRES_DB: fwdflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fwdflow -d fwdflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fwdflow:fwdflow_ci@127.0.0.1:5432/fwdflow
      DATABASE_URL_TEST: postgresql+psycopg://fwdflow:fwdflow_ci@127.0.0.1:5432/fwdflow_test
      LLM_MODE: replay
      PGPASSWORD: fwdflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --directory api --locked
      - name: Tạo database test
        run: createdb -h 127.0.0.1 -U fwdflow fwdflow_test
      - run: uv run --directory api ruff check .
      - run: uv run --directory api pytest -q

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
