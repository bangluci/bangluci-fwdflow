[project]
name = "fwdflow-api"
version = "0.1.0"
description = "FwdFlow API — quản lý lô hàng nhập khẩu door-to-door tích hợp AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "anthropic>=1.0",
    "sqlglot>=25.0",
    "pgvector>=0.3",
    "fpdf2>=2.7",
    "segno>=1.6",
    "pillow>=10.4",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]
# Nặng (torch) — chỉ cài khi làm AI #2: `uv sync --group hs`
hs = ["sentence-transformers>=3.0"]
eval = ["pdfplumber>=0.11", "scipy>=1.13"]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
